@if(chatService.currentOpendedChat()){
    <div class="p-3">
    <div class="flex flex-col text-center items-center mt-3">
        <img class="rounded-full mb-4 w-44 h-44 object-cover" [src]="chatService.currentOpendedChat()?.profilePicture"
        alt="profile pic"/>
        <div class="ml=3">
            <p class="text-lg font-semibold">
                {{chatService.currentOpendedChat()?.fullName | titlecase}} 

            </p>

            <p class="text-sm text-gray-500">
                {{chatService.currentOpendedChat()?.userName}}

            </p>

        </div>
    </div>

</div>

}
